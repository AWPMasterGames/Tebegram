# Автосборка установщика: при пуше тега v* собирает setup.exe и прикладывает к релизу.
# Inno Setup уже предустановлен на GitHub-раннерах windows-latest.
name: Build installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Нужно, чтобы workflow мог создать релиз и приложить к нему установщик
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build installer
        shell: pwsh
        run: powershell -File Installer/build-installer.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TebegramSetup
          path: Installer/Output/TebegramSetup-*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Помечаем как «latest» — на эту страницу ведёт кнопка обновления в клиенте
          make_latest: true
          generate_release_notes: true
          files: Installer/Output/TebegramSetup-*.exe
